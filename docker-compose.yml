services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: mpamboly_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mpamboly
      POSTGRES_PASSWORD: mpamboly_dev
      POSTGRES_DB: mpamboly_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mpamboly']
      interval: 5s
      timeout: 5s
      retries: 5

  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: mpamboly_mqtt
    restart: unless-stopped
    ports:
      - '1883:1883'
      - '9001:9001'
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

  redis:
    image: redis:7-alpine
    container_name: mpamboly_redis
    restart: unless-stopped
    ports:
      - '6379:6379'

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mpamboly_backend
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: mpamboly
      DB_PASSWORD: mpamboly_dev
      DB_NAME: mpamboly_db
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/usr/src/app/src
    command: npm run start:dev

volumes:
  postgres_data:
